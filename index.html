<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071223">
  <title>MEGA / Аудиогид</title>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <div id="cover-glow" class="cover-glow" aria-hidden="true"></div>

  <main class="app">
    <header class="header">
      <span class="logo">ITMO<br>MEGA<br>BATTLE</span>
      <span class="header-title">Аудиогид</span>
    </header>

    <article class="card">
      <div class="art"><img id="cover" alt="" width="600" height="600" decoding="async"></div>

      <section class="track">
        <div class="title-row">
          <h1 id="title"></h1>
          <span class="equalizer" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        </div>

        <div class="timeline">
          <div class="progress"><div id="bar" class="bar"></div></div>
          <input id="seek" class="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Позиция в записи" disabled>
        </div>
        <div class="times"><span id="elapsed">0:00</span><span id="duration">—</span></div>

        <div class="controls">
          <button id="back" class="round" aria-label="Предыдущая история" disabled>
            <svg viewBox="0 0 24 24"><path d="M6 5v14M19 5v14L8 12Z"/></svg>
          </button>
          <button id="play" class="round play" aria-label="Слушать" data-state="paused" disabled>
            <svg class="play-icon" viewBox="0 0 24 24"><path d="m9 5 11 7-11 7Z"/></svg>
            <svg class="pause-icon" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>
            <span class="loading-icon" aria-hidden="true"></span>
          </button>
          <button id="next" class="round" aria-label="Следующая история" disabled>
            <svg viewBox="0 0 24 24"><path d="M18 5v14M5 5v14l11-7Z"/></svg>
          </button>
        </div>

        <div class="volume-row">
          <span class="ambient-caption"><i></i>Звуковой фон</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4ZM15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg>
          <input id="volume" class="volume" type="range" min="0" max="100" value="90" aria-label="Громкость">
        </div>

        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
    </article>

    <button id="scan" class="scan-button" disabled>
      <span class="scan-icon"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M7 12h10"/></svg></span>
      Сканировать QR-код
    </button>
  </main>

  <dialog id="scanner" class="scanner">
    <form method="dialog" class="scanner-head">
      <span>Сканировать QR-код</span>
      <button class="close" aria-label="Закрыть сканер">✕</button>
    </form>
    <div class="camera-box">
      <video id="camera" autoplay playsinline muted></video>
      <div class="scan-frame"><i></i></div>
    </div>
    <p id="camera-status" class="camera-status" role="status"></p>
    <button id="retry" class="secondary" hidden>Повторить</button>
  </dialog>
</body>
</html>
