<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#001a31"><title>MEGA / QR-коды</title><style>
*{box-sizing:border-box}body{font:14px Arial,sans-serif;color:#001a31;background:#f1f4f7;margin:0;padding:28px}header,main,.instructions{max-width:880px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:22px;letter-spacing:-.6px}button,.download{font:inherit;border:0;background:#0969ee;color:white;border-radius:10px;padding:13px 18px;cursor:pointer;text-decoration:none;display:inline-block}main{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}article{background:white;text-align:center;border:1px solid #dbe3eb;border-radius:15px;padding:24px;break-inside:avoid}article.start{grid-column:1/-1}canvas{width:100%!important;height:auto!important;max-width:280px;image-rendering:pixelated}h2{font-size:17px;margin:12px 0}.link{display:block;font-size:11px;color:#52697d;word-break:break-all;margin:12px 0}.instructions{line-height:1.7;color:#52697d;margin-top:18px}.instructions a{color:#0969ee}.download{background:#edf3fc;color:#0969ee;font-size:11px;padding:9px 12px}.printnote{font-size:11px;color:#52697d;line-height:1.5}#error{color:#ba2737}@media(max-width:550px){body{padding:18px}h1{font-size:18px}main{gap:10px}article{padding:12px}h2{font-size:14px}.start canvas{max-width:280px}}@media print{body{padding:0;background:white}button,.download,.instructions,.link{display:none}header{margin-bottom:12px}main{gap:12px;margin-top:0}article{border-radius:0;padding:12px}article.start{grid-column:auto}canvas{max-width:200px}.printnote{color:black}}
</style><header><h1>ITMO MEGA BATTLE<br>QR-коды аудиогида</h1><button onclick="window.print()">Печать</button></header><p class="instructions">1. Отсканируй <b>стартовый QR</b> обычной камерой телефона и нажми ▶.<br>2. Коды экспонатов сканируй <b>кнопкой внутри плеера</b>: фон продолжит играть.<br><span id="connection"></span></p><p id="error" class="instructions" role="status"></p><main id="codes"></main><script src="runtime.js"></script><script src="content.js"></script><script src="qrcode.js"></script><script src="qr-page.js"></script></html>
