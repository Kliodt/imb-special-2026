# nginx inside the container. TLS and compression are done in front of it (Caddy or the host nginx).
server {
    listen 8080;
    server_tokens off;

    # Vite build output: file names carry a content hash, so they are cached forever.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # public/ is mounted from the host (docker-compose.yml), so config.json, audio, covers and qr
    # are edited on the server without rebuilding the image. Anything else comes from the build.
    # no-cache = revalidate by ETag every time: edits reach visitors at once, unchanged files cost a 304.
    location / {
        root /srv/content;
        add_header Cache-Control "no-cache";
        try_files $uri @build;
    }

    location @build {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
