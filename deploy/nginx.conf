# Alternative to the Caddy service, for a server that already runs nginx on 80/443.
# Start only the app: `docker compose up -d guide`. Issue the certificate with
# `certbot --nginx -d imb-special.ru`, put this file into /etc/nginx/sites-available/audioguide
# and link it into sites-enabled. Replace the domain and, if changed, the port (GUIDE_HOST_PORT).

server {
    listen 80;
    server_name imb-special.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name imb-special.ru;

    ssl_certificate     /etc/letsencrypt/live/imb-special.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imb-special.ru/privkey.pem;

    # Only after checking that the domain works over https
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
